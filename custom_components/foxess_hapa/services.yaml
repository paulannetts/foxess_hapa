set_schedule:
  name: Set Schedule
  description: Replace the full battery charge schedule with a new set of time periods.
  fields:
    config_entry_id:
      name: Device
      description: The FoxESS device to update.
      required: true
      selector:
        config_entry:
          integration: foxess_hapa
    periods:
      name: Periods
      description: >
        List of 1–8 schedule periods. Each period must have start_time, end_time,
        and work_mode. min_soc, max_soc, fd_soc and fd_pwr are optional.
        Supported work modes vary by device and are validated against the
        device's own list; fd_soc/fd_pwr are validated against its reported
        ranges.
      required: true
      example:
        - start_time: "00:00"
          end_time: "03:30"
          work_mode: ForceCharge
          min_soc: 10
          max_soc: 90
        - start_time: "03:30"
          end_time: "23:59"
          work_mode: SelfUse
          min_soc: 20
      selector:
        object:

set_slot:
  name: Set Slot
  description: Update a single schedule slot by index, preserving all other slots.
  fields:
    config_entry_id:
      name: Device
      description: The FoxESS device to update.
      required: true
      selector:
        config_entry:
          integration: foxess_hapa
    slot:
      name: Slot
      description: Zero-based index of the slot to update (0–7).
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    start_time:
      name: Start time
      description: "Start time for the slot in HH:MM format."
      example: "00:00"
      selector:
        text:
    end_time:
      name: End time
      description: "End time for the slot in HH:MM format."
      example: "03:30"
      selector:
        text:
    work_mode:
      name: Work mode
      description: Battery work mode for this slot.
      selector:
        select:
          custom_value: true
          options:
            - SelfUse
            - Feedin
            - Backup
            - ForceCharge
            - ForceDischarge
            - ForceCharge(BAT)
            - ForceDischarge(BAT)
            - ForceCharge(AC)
            - ForceDischarge(AC)
            - PeakShaving
    enabled:
      name: Enabled
      description: Whether this slot is active.
      selector:
        boolean:
    min_soc:
      name: Min SoC
      description: Minimum battery state of charge (%) on grid power.
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
    max_soc:
      name: Max SoC
      description: Maximum battery state of charge (%) to charge to.
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
    fd_soc:
      name: Force charge/discharge SoC
      description: >
        SoC at which Force Charge or Force Discharge stops (the FoxESS app calls
        this "Discharging Cut-off SoC" on a discharge slot). Applies to both force
        modes. Device-specific range; commonly 10-100%.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    fd_pwr:
      name: Force charge/discharge power
      description: >
        Maximum power for Force Charge or Force Discharge (the FoxESS app calls
        this "Discharge Power to Grid" on a discharge slot). Device-specific
        maximum - an H3 reports 10500 W - and validated against the device.
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: "W"
          mode: box
