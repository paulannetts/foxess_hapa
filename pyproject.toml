[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/foxess_hapa"]

[project]
name = "ha_test01"
version = "0.1.0"
description = "Home Assistant custom component integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = [
    "colorlog==6.12.0",
    "homeassistant==2026.11.1",
    "go2rtc-client>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pip>=21.3.1",
    # Pins pytest and homeassistant exactly; bump together with homeassistant
    # (see the Dependabot "homeassistant" group).
    "pytest-homeassistant==2026.11.1",
    "ruff==0.17.5",
]

[tool.ruff]
# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
target-version = "py314"

[tool.ruff.lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # Missing copyright notice at top of file (not used in this project)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is how pytest checks things
    "PLR2004", # magic values are the expected results
    "SLF001", # tests exercise private helpers directly
    "FBT001", # boolean parametrize arguments
    "S105", # fake API keys in fixtures
    "S106", # fake API keys in fixtures
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = ["-p", "no:respx"]
